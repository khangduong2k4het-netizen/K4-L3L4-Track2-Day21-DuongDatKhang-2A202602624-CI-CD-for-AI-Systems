name: Income Model CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      training_preset:
        description: Training configuration (weak preset demonstrates a blocked Release)
        type: choice
        options: [params.yaml, weak-model-demo]
        default: params.yaml

permissions:
  contents: read
  actions: read

concurrency:
  group: income-api-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Authenticate to S3
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
      - name: Pull data with DVC
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          test -n "$ARTIFACT_BUCKET"
          python -m dvc remote add -d -f labstore "s3://$ARTIFACT_BUCKET/dvc"
          python -m dvc remote modify labstore region "$AWS_DEFAULT_REGION"
          python -m dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc
      - name: Select weak model for gate demonstration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.training_preset == 'weak-model-demo' }}
        run: |
          python - <<'PYEOF'
          import yaml
          with open('params.yaml', 'w') as destination:
              yaml.safe_dump({'n_estimators': 50, 'learning_rate': 0.05, 'max_depth': 2}, destination)
          PYEOF
      - name: Train model
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
          MLFLOW_ARTIFACT_ROOT: ./mlartifacts
        run: python src/train.py
      - name: Read report
        id: read_report
        run: |
          python - <<'PYEOF'
          import json
          import os
          with open('outputs/report.json') as source:
              report = json.load(source)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as destination:
              destination.write(f"f1={report['f1_score']}\n")
          print(f"F1: {report['f1_score']:.4f} | Accuracy: {report['accuracy']:.4f}")
          PYEOF
      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json
          if-no-files-found: error
      - name: Save candidate model as artifact
        uses: actions/upload-artifact@v4
        with:
          name: candidate-model
          path: models/model.joblib
          if-no-files-found: error
          retention-days: 7

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check quality gate
        env:
          F1_SCORE: ${{ needs.train.outputs.f1 }}
        run: python .github/scripts/check_quality.py

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download approved model
        uses: actions/download-artifact@v4
        with:
          name: candidate-model
          path: models
      - name: Install AWS SDK
        run: python -m pip install boto3==1.43.106
      - name: Authenticate to S3
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
      - name: Publish approved model to S3
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os
          import boto3
          bucket = os.environ['ARTIFACT_BUCKET']
          if not bucket:
              raise SystemExit('ARTIFACT_BUCKET is missing')
          boto3.client('s3').upload_file('models/model.joblib', bucket, 'artifacts/current/model.joblib')
          print('Approved model uploaded to S3.')
          PYEOF
      - name: Deploy approved code through SSM
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: python .github/scripts/deploy_ssm.py
      - name: Verify public API
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          curl --fail --silent --show-error --max-time 10 "http://$SERVER_HOST:8080/healthz"
          curl --fail --silent --show-error --max-time 10 "http://$SERVER_HOST:8080/score" -H 'Content-Type: application/json' -d '{"features":[60,2,5,2,4,0,1,0,0,45]}'
